<style>
:root{--navy:#0B2A4A;--ink:#173A5E;--sky:#E9F3FF;--cyan:#12B5E5;--sun:#FFC93C;--coral:#FF6B6B;--mint:#3DDC97;--lilac:#9B7BFF;--peach:#FF9F68;--grey:#6C7A8A;--shadow:0 8px 0 rgba(11,42,74,.10)}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',Arial,sans-serif;background:var(--sky);color:var(--navy);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
header img{width:44px;height:44px;border-radius:14px;box-shadow:var(--shadow)}
header h1{font-size:22px;margin:0;font-weight:900}
header small{display:block;color:var(--grey);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.login{max-width:380px;margin:80px auto;text-align:center}
.login input{width:100%;padding:14px;border-radius:12px;border:2px solid #d5e3f2;font-size:16px;margin-bottom:12px;font-family:inherit}
.btn{background:var(--cyan);color:#fff;font-weight:900;font-size:15px;padding:12px 20px;border:0;border-radius:14px;cursor:pointer;box-shadow:0 5px 0 #0d8fb6}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0d8fb6}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 5px 0 #d5e3f2;border:2px solid #eef4fa}
.err{color:var(--coral);font-weight:800;font-size:13px;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border-radius:18px;padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:30px;color:var(--cyan)}
.stat span{font-size:11px;font-weight:900;color:var(--grey);text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 8px;color:var(--grey);font-size:11px;text-transform:uppercase;border-bottom:2px solid #eef4fa}
td{padding:10px 8px;border-bottom:1px solid #f2f6fb}
tr:hover td{background:#f8fbff}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:900;font-size:11px}
.pill.hi{background:#e3faf1;color:#1fb87a}
.pill.mid{background:#fff6e0;color:#c98a0e}
.pill.lo{background:#ffeaea;color:#d94b4b}
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.search{padding:10px 14px;border-radius:12px;border:2px solid #d5e3f2;font-family:inherit;font-size:14px;min-width:220px}
.mini{color:var(--grey);font-size:12px;margin:0}
.topicbar{display:flex;align-items:center;gap:8px;margin:6px 0}
.topicbar .bar{flex:1;height:10px;background:#eef4fa;border-radius:99px;overflow:hidden}
.topicbar .bar i{display:block;height:100%}
.empty{text-align:center;color:var(--grey);padding:30px;font-weight:700}
.tag{background:var(--sky);color:var(--ink);font-weight:900;font-size:11px;padding:3px 10px;border-radius:99px}
</style>
</head>

<script>
/* ===================== CONFIGURA AQUÍ TU PROYECTO FIREBASE =====================
   Debe ser EXACTAMENTE el mismo firebaseConfig que pusiste en danivia-school.html */
const firebaseConfig = {
  apiKey: "AIzaSyCNe7h2OX5yu3a-Adt48gXPA29D3OrTW8s",
  authDomain: "danivia-school.firebaseapp.com",
  projectId: "danivia-school",
  storageBucket: "danivia-school.firebasestorage.app",
  messagingSenderId: "397698140157",
  appId: "1:397698140157:web:5738640d6191bce1fe3b94"
};
/* ================================================================================ */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let ALL = [];

function $(id){return document.getElementById(id)}

function doLogin(){
  const email = $('loginEmail').value.trim();
  const pass = $('loginPass').value;
  $('loginErr').textContent='';
  if(!email||!pass){$('loginErr').textContent='Escribe correo y contraseña';return}
  auth.signInWithEmailAndPassword(email,pass).catch(e=>{
    $('loginErr').textContent = e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'
      ? 'Correo o contraseña incorrectos' : 'Error: '+e.message;
  });
}
function doLogout(){auth.signOut()}

auth.onAuthStateChanged(user=>{
  if(user){$('loginScreen').style.display='none';$('dashScreen').style.display='block';loadData()}
  else{$('loginScreen').style.display='block';$('dashScreen').style.display='none'}
});

function loadData(){
  db.collection('students').get().then(snap=>{
    ALL = snap.docs.map(d=>d.data());
    renderStats();
    renderTable();
    renderWeak();
  }).catch(e=>{
    $('emptyMsg').style.display='block';
    $('emptyMsg').textContent='No se pudieron cargar los datos: '+e.message;
  });
}

function renderStats(){
  const installs = new Set(ALL.map(s=>s.installId)).size;
  const students = ALL.length;
  const totalDone = ALL.reduce((a,s)=>a+(s.totalDone||0),0);
  const totalOk = ALL.reduce((a,s)=>a+(s.totalOk||0),0);
  const avgAcc = totalDone? Math.round(totalOk/totalDone*100) : 0;
  const totalStars = ALL.reduce((a,s)=>a+(s.stars||0),0);
  $('statGrid').innerHTML = `
    <div class="stat"><b>${installs}</b><span>Dispositivos</span></div>
    <div class="stat"><b>${students}</b><span>Alumnos</span></div>
    <div class="stat"><b>${totalDone}</b><span>Preguntas resp.</span></div>
    <div class="stat"><b>${avgAcc}%</b><span>Acierto medio</span></div>
    <div class="stat"><b>⭐ ${totalStars}</b><span>Estrellas totales</span></div>
  `;
}

function renderTable(){
  const q = ($('searchBox').value||'').toLowerCase();
  const rows = ALL.filter(s=> (s.name||'').toLowerCase().includes(q) || (s.courseName||'').toLowerCase().includes(q));
  $('emptyMsg').style.display = ALL.length? 'none':'block';
  $('studentBody').innerHTML = rows.sort((a,b)=>((b.lastSession&&b.lastSession.d)||0)-((a.lastSession&&a.lastSession.d)||0)).map(s=>{
    const last = s.lastSession ? `${s.lastSession.s||''} · ${s.lastSession.ok}/${s.lastSession.n}` : '—';
    const accClass = s.accuracy>=75?'hi':s.accuracy>=50?'mid':'lo';
    return `<tr>
      <td>${s.avatar||'👤'} <b>${escapeHtml(s.name||'—')}</b></td>
      <td><span class="tag">${escapeHtml(s.courseName||'—')}</span></td>
      <td>⭐ ${s.stars||0}</td>
      <td>🔥 ${s.streak||0}</td>
      <td>${s.totalDone||0}</td>
      <td><span class="pill ${accClass}">${s.accuracy||0}%</span></td>
      <td class="mini">${escapeHtml(last)}</td>
    </tr>`;
  }).join('') || '';
}

function renderWeak(){
  const agg = {};
  ALL.forEach(s=>(s.weakTopics||[]).forEach(w=>{
    const key = w.subj+' · '+w.topic;
    agg[key] = agg[key] || {done:0,ok:0,subj:w.subj,topic:w.topic};
    agg[key].done += w.done; agg[key].ok += w.ok;
  }));
  // Solo se consideran "con dificultad" los temas por debajo del 80% de aciertos,
  // aunque algún dato antiguo sincronizado antes de este ajuste llegara con un % más alto.
  const list = Object.values(agg).map(x=>({...x,pct:Math.round(x.ok/x.done*100)}))
    .filter(x=>x.pct<80)
    .sort((a,b)=>a.pct-b.pct).slice(0,12);
  $('weakList').innerHTML = list.length ? list.map(x=>{
    const color = x.pct>=60?'#FFC93C':'#FF6B6B';
    return `<div class="topicbar">
      <span style="min-width:220px;font-weight:800;font-size:13px">${escapeHtml(x.subj)} · ${escapeHtml(x.topic)}</span>
      <div class="bar"><i style="width:${x.pct}%;background:${color}"></i></div>
      <span style="min-width:40px;text-align:right;font-weight:900">${x.pct}%</span>
    </div>`;
  }).join('') : '<p class="mini">🎉 Ningún tema con dificultad destacable ahora mismo (todos por encima del 80% de acierto).</p>';
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
