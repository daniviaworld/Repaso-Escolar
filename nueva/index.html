<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Danivia School · Repaso GVA</title>
  <meta name="description" content="Repaso escolar de Infantil y Primaria siguiendo el currículo de la Generalitat Valenciana.">
  <meta name="theme-color" content="#E1EDFA">
  <link rel="stylesheet" href="piel.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Danivia School">
</head>
<body data-etapa="primaria" data-oscuro="no">
  <div class="app" id="app"></div>

  <script src="datos.js"></script>
  <script src="dani.js"></script>
  <script src="sonido.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="motor-js.js"></script>
  <script src="motor.js"></script>
  <script src="app.js"></script>
  <script src="extras.js"></script>
  <script src="juegos.js"></script>
  <script src="minijuegos.js"></script>
  <script src="nube.js"></script>
  <script>
    nubeArranca();
    arranca();
    // Se instala el trabajador de fondo para poder abrir sin internet (ver sw.js).
    // Si el navegador no lo soporta, o la página se abre como archivo suelto, no
    // pasa nada: la web funciona igual, solo que necesitando conexión la primera vez.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
